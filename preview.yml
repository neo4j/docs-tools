site:
  title: Docs Tools
  start_page: docs-tools:ROOT:index.adoc
  url: https://neo4j.com/docs/

content:
  sources:
  - url: https://@gitlab.com/antora/demo/demo-component-a.git
    branches: HEAD
  - url: ./
    branches: HEAD
    exclude:
    - '!**/_includes/*'
    - '!**/readme.adoc'
    - '!**/README.adoc'

ui:
  bundle:
    url: https://static-content.neo4j.com/build/ui-bundle.zip
    snapshot: true

urls:
  html_extension_style: indexify

output:
  dir: ./build/site

antora:
  extensions:
  - "./extensions/antora/table-footnotes"
  - "./extensions/antora/roles-labels"

asciidoc:
  extensions:
  - "@neo4j-documentation/macros"
  - "./extensions/asciidoc/mark-terms/mark-terms"
  attributes:
    page-theme: docs
    page-type: Docs
    page-search-type: Docs
    page-search-site: Reference Docs
    page-canonical-root: /docs
    page-pagination: true
    page-no-canonical: true
    page-origin-private: true
    page-hide-toc: false
    page-mixpanel: 4bfb2414ab973c741b6f067bf06d5575
    includePDF: false
    nonhtmloutput: ""
    neo4j-docs-base-uri: https://neo4j.com/docs
    page-terms-to-mark: Neo4j, Cypher, test term
    # tabs
    page-tabs: tools
    page-tabs-index: 2