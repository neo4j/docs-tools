name: "Generate PDF"
run-name: "Generate PDF from ${{ inputs.build-ref || github.ref_name }} for ${{ inputs.publish-env }}"

permissions:
  contents: read

# Builds a PDF and sends it to docs-publish. Started by docs-trigger-builds.yml, not by hand:
# publish-env is set by the trigger. The PDF is built from build-ref, or from the branch the
# run is on when build-ref is blank. A version branch is built from the dev branch with its
# own name in build-ref, so the branch it runs on is the one docs-publish checks.
# Uses a relative path to the reusable PDF build, like docs-generate-html.yml.
on:
  workflow_dispatch:
    inputs:
      publish-env:
        description: "The environment to publish to"
        type: choice
        required: true
        options:
        - dev
        - prod
      build-ref:
        description: "The branch to build. Leave blank to build the branch this workflow runs on."
        type: string
        required: false
        default: ''

jobs:

  docs-build-pdf:
    name: Generate PDF
    uses: ./.github/workflows/reusable-docs-pdf-build.yml
    with:
      docs-dir: 'docs'
      build-ref: ${{ inputs.build-ref || github.ref_name }}
      fetch-depth: 0
      publish-env: ${{ inputs.publish-env }}

  # Hand off to docs-publish (a separate repo) to actually publish this run's "pdf"
  # artifact - same mechanism docs-generate-html.yml already uses for its "docs"
  # artifact. docset/version come from docs-build-pdf itself (read back out of the
  # PDF's own build path - see reusable-docs-pdf-build.yml), since there's no HTML
  # directory tree here for docs-publish to infer them from the way it does for HTML.
  publish-pdf:
    name: Publish PDF
    needs: docs-build-pdf
    runs-on: ubuntu-latest
    steps:
      - name: Publish to ${{ inputs.publish-env }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 #v4
        with:
          token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          repository: neo4j/docs-publish
          event-type: publish-pdf
          client-payload: |-
            {
              "org": "${{ github.repository_owner }}",
              "repo": "${{ github.event.repository.name }}",
              "run_id": "${{ github.run_id }}",
              "publish_env": "${{ inputs.publish-env }}",
              "docset": "${{ needs.docs-build-pdf.outputs.docset }}",
              "version": "${{ needs.docs-build-pdf.outputs.version }}"
            }
