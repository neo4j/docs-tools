name: "Generate PDF"
run-name: "Generate ${{ inputs.publish-env != '' && inputs.publish-env || (github.ref_name == vars.DOCS_PROD_BRANCH && 'prod' || 'dev') }} PDF from ${{ github.ref_name }}"

permissions:
  contents: read

# Mirrors docs-generate-html.yml's trigger shape (workflow_dispatch with a publish-env
# input) and its resolve-env -> build -> publish shape. There is no build-ref input: the
# branch to build is the one this run was dispatched on (github.ref_name). Still simpler than
# that workflow in one way: there's no docs-verify step (no equivalent check exists yet
# for a PDF), and build/publish are two plain jobs rather than a reusable-workflow call
# plus a verify call. Uses a relative path (this workflow lives in the same repo as
# reusable-docs-pdf-build.yml, testing it against docs-tools' own docs/ as the fixture)
# rather than a versioned `neo4j/docs-tools/...@v2`-style reference, the same way
# docs-generate-html.yml does for reusable-docs-build.yml.
on:
  workflow_dispatch:
    inputs:
      publish-env:
        description: 'Override for dev/prod. Leave blank to derive it from the branch against vars.DOCS_PROD_BRANCH - only needs setting explicitly when DOCS_DEV_BRANCH == DOCS_PROD_BRANCH, where the branch alone cannot tell the two builds apart.'
        type: string
        required: false
        default: ''

jobs:

  # Resolves publish-env (dev/prod) once, so publish-pdf doesn't duplicate the
  # override-or-derive logic - same job as docs-generate-html.yml's own resolve-env.
  resolve-env:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      publish-env: ${{ steps.resolve.outputs.publish-env }}
    steps:
      - name: Resolve publish-env
        id: resolve
        env:
          PUBLISH_ENV_OVERRIDE: ${{ inputs.publish-env }}
          BUILD_REF: ${{ github.ref_name }}
          PROD_BRANCH: ${{ vars.DOCS_PROD_BRANCH }}
        run: |
          if [[ -n "${PUBLISH_ENV_OVERRIDE}" ]]; then
            publish_env="${PUBLISH_ENV_OVERRIDE}"
          elif [[ "${BUILD_REF}" == "${PROD_BRANCH}" ]]; then
            publish_env="prod"
          else
            publish_env="dev"
          fi

          echo "publish-env=${publish_env}" >> $GITHUB_OUTPUT

  docs-build-pdf:
    name: Generate PDF
    uses: ./.github/workflows/reusable-docs-pdf-build.yml
    with:
      docs-dir: 'docs'
      build-ref: ${{ github.ref_name }}
      fetch-depth: 0

  # Hand off to docs-publish (a separate repo) to actually publish this run's "pdf"
  # artifact - same mechanism docs-generate-html.yml already uses for its "docs"
  # artifact. docset/version come from docs-build-pdf itself (read back out of the
  # PDF's own build path - see reusable-docs-pdf-build.yml), since there's no HTML
  # directory tree here for docs-publish to infer them from the way it does for HTML.
  publish-pdf:
    name: Publish PDF
    needs: [docs-build-pdf, resolve-env]
    runs-on: ubuntu-latest
    steps:
      - name: Publish to ${{ needs.resolve-env.outputs.publish-env }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 #v4
        with:
          token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          repository: neo4j/docs-publish
          event-type: publish-pdf
          client-payload: |-
            {
              "org": "${{ github.repository_owner }}",
              "repo": "${{ github.event.repository.name }}",
              "run_id": "${{ github.run_id }}",
              "publish_env": "${{ needs.resolve-env.outputs.publish-env }}",
              "docset": "${{ needs.docs-build-pdf.outputs.docset }}",
              "version": "${{ needs.docs-build-pdf.outputs.version }}"
            }
