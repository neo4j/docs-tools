name: "Generate PDF"

permissions:
  contents: read

# Mirrors docs-generate-html.yml's trigger shape (workflow_dispatch with a
# build-ref input). Deliberately simpler for now: PDF export always builds
# from preview-pdf.yml regardless of environment (no publish-pdf.yml/dev-vs-
# prod split yet - see reusable-docs-pdf-build.yml's pdf-playbook input), and
# there's no publish hand-off step - it just uploads the PDF as a build
# artifact until a real publish target exists. Uses a relative path (this
# workflow lives in the same repo as reusable-docs-pdf-build.yml, testing it
# against docs-tools' own docs/ as the fixture) rather than a versioned
# `neo4j/docs-tools/...@v2`-style reference, the same way docs-generate-
# html.yml does for reusable-docs-build.yml.
#
# TEMPORARY (pilot testing only): also runs on push, to any branch. GitHub
# only lets you dispatch a workflow_dispatch-triggered workflow once it
# exists on the default branch - push has no such restriction, so this is how
# to actually see it run from a feature branch before that's true. Remove
# once this is either merged or has a real trigger design.
on:
  workflow_dispatch:
    inputs:
      build-ref:
        description: 'The git ref to build from'
        type: string
        required: true
  push:
    branches:
      - pdf-renderer-package

jobs:

  docs-build-pdf:
    name: Generate PDF
    uses: ./.github/workflows/reusable-docs-pdf-build.yml
    with:
      docs-dir: 'docs'
      build-ref: ${{ inputs.build-ref || github.ref_name }}
      fetch-depth: 0
      # docs-tools-ref defaults to 'v2' (the real, released tag), which
      # doesn't have pdf/ yet - only this branch does, since this workflow
      # only exists here too. Passing github.ref_name makes this self-test
      # check out the exact same ref that's actually running, so it finds
      # pdf/. Remove once this is merged and defaulting to a real tag works.
      docs-tools-ref: ${{ github.ref_name }}
