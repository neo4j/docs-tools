name: Publish npm packages

# When a merge to dev changes the version in a package.json, publish that package
# to npm. Only @neo4j-antora/* packages are published, and only if that exact
# version is not already on the registry, so re-runs are safe.

permissions:
  contents: read

on:
  push:
    branches:
    - dev
    paths:
    - 'pdf-generator/package.json'
    - 'extensions/antora/*/package.json'
    - 'extensions/asciidoc/*/package.json'

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Restricted to the dev branch in the repo settings. Also set as the
    # environment name on each package Trusted Publisher on npmjs.com.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC); no npm token is stored

    steps:
    - name: Patch eMudhra CA compromise
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --only-upgrade -y ca-certificates
        sudo update-ca-certificates --fresh

    - name: Distrust remaining eMudhra/emSign roots (system and Node)
      # Mozilla removed emSign ECC Root CA - G3 (and C1, C3) from NSS after the
      # eMudhra intermediate CA incident. Node 24.22.1, which we enforce, carries
      # that change, but the Ubuntu system store still trusts those roots, so tools
      # such as curl and git would too. Build a system CA bundle without any
      # eMudhra/emSign root (emSign Root CA - G1 is the one Node still trusts, which
      # Mozilla has not distrusted; dropping it is belt and braces) and point
      # OpenSSL and Node (--use-openssl-ca) at it for every later step in this job.
      # SSL_CERT_DIR is an empty directory so OpenSSL does not also load
      # /etc/ssl/certs.
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/ca-empty"
        python3 - <<'PY'
        import os, re, subprocess
        certs = re.findall(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----\n',
                           open('/etc/ssl/certs/ca-certificates.crt').read(), re.S)
        keep, drop = [], 0
        for c in certs:
            subj = subprocess.run(['openssl', 'x509', '-noout', '-subject'], input=c,
                                  capture_output=True, text=True).stdout
            if re.search(r'emsign|emudhra', subj, re.I):
                drop += 1
            else:
                keep.append(c)
        assert len(keep) > 100, 'CA bundle unexpectedly small'
        out = os.path.join(os.environ['RUNNER_TEMP'], 'ca-bundle-no-emudhra.crt')
        open(out, 'w').write(''.join(keep))
        print(f'kept {len(keep)} roots, removed {drop} eMudhra/emSign roots')
        PY
        {
          echo "SSL_CERT_FILE=$RUNNER_TEMP/ca-bundle-no-emudhra.crt"
          echo "SSL_CERT_DIR=$RUNNER_TEMP/ca-empty"
          echo "NODE_OPTIONS=--use-openssl-ca"
        } >> "$GITHUB_ENV"


    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Use Node.js version 24.22.1
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
      with:
        node-version: 24.22.1

    - name: Find packages with an unpublished version
      id: find
      env:
        BEFORE: ${{ github.event.before }}
      run: |
        set -euo pipefail
        if [ -n "${BEFORE:-}" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE" 2>/dev/null; then
          base="$BEFORE"
        else
          base="HEAD^"
        fi
        globs=('pdf-generator/package.json' 'extensions/antora/*/package.json' 'extensions/asciidoc/*/package.json')
        files=$(git diff --name-only "$base" HEAD -- "${globs[@]}")
        dirs=""
        for f in $files; do
          [ -f "$f" ] || continue
          name=$(jq -r '.name' "$f")
          version=$(jq -r '.version' "$f")
          private=$(jq -r '.private // false' "$f")
          if [ "$private" = "true" ] || [[ "$name" != @neo4j-antora/* ]]; then
            echo "Skipping $f ($name): private or not an @neo4j-antora package"
            continue
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "Skipping $name@$version: already published"
            continue
          fi
          echo "Will publish $name@$version"
          dirs="$dirs $(dirname "$f")"
        done
        echo "dirs=${dirs# }" >> "$GITHUB_OUTPUT"

    - name: Publish
      if: steps.find.outputs.dirs != ''
      env:
        DIRS: ${{ steps.find.outputs.dirs }}
      run: |
        set -euo pipefail
        echo "npm $(npm --version) (trusted publishing needs 11.5.1 or later)"
        for d in $DIRS; do
          echo "::group::Publishing $d"
          (cd "$d" && npm publish --access public --ignore-scripts)
          echo "::endgroup::"
        done
