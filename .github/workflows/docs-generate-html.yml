name: "Generate HTML"
run-name: "Generate ${{ inputs.publish-env }} HTML from ${{ inputs.build-ref }}"

permissions:
  contents: read

# Builds, verifies, and publishes docs for ONE environment, as a run entirely independent
# of any other environment's run. Triggered (via the API, not a workflow_call) by
# docs-trigger-builds.yml, once per environment that applies to a given push (dev, prod, or both) -
# so if dev's run fails, prod's run is completely unaffected, and vice versa.
#
# Do not run this by hand. It has a workflow_dispatch trigger only because the API call
# that starts it needs one, and it must run as its own run so that its head_branch is the
# branch being built (which docs-publish checks), so it cannot be a workflow_call either.
# To build now, run docs-trigger-builds.yml from the branch instead: it works out the
# environments the same way it does for a push.
on:
  workflow_dispatch:
    inputs:
      build-ref:
        description: 'The git ref to build from'
        type: string
        required: true
      publish-env:
        description: 'The environment to publish to'
        type: choice
        required: true
        options:
        - dev
        - prod

jobs:

  docs-build:
    name: Generate HTML
    uses: ./.github/workflows/reusable-docs-build.yml
    with:
      docs-dir: 'docs'
      package-script: 'verify:publish'
      build-ref: ${{ inputs.build-ref }}
      fetch-depth: 0
      publish-env: ${{ inputs.publish-env }}
    # A called workflow does not get the caller's secrets automatically. Pass just these
    # (not `secrets: inherit`, which would hand over every secret the caller can see,
    # e.g. DOCS_DISPATCH_TOKEN, to a workflow referenced by a moving tag).
    secrets:
      DOCS_NAV_USER_AGENT: ${{ secrets.DOCS_NAV_USER_AGENT }}
      DOCS_TESTING_CRAWLER: ${{ secrets.DOCS_TESTING_CRAWLER }}

  docs-verify:
    name: Verify HTML
    needs: docs-build
    uses: ./.github/workflows/reusable-docs-verify.yml
    with:
      failOnWarnings: true

  # Hand off to docs-publish (a separate repo) to actually publish this run's "docs"
  # artifact.
  publish-html:
    name: Publish HTML
    needs: docs-verify
    runs-on: ubuntu-latest
    steps:
      - name: Publish to ${{ inputs.publish-env }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 #v4
        with:
          token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          repository: neo4j/docs-publish
          event-type: publish-html
          client-payload: |-
            {
              "org": "${{ github.repository_owner }}",
              "repo": "${{ github.event.repository.name }}",
              "run_id": "${{ github.run_id }}",
              "publish_env": "${{ inputs.publish-env }}"
            }
