name: "Generate HTML"
run-name: "Generate HTML for ${{ inputs.dispatch-env }}"

permissions:
  contents: read

# Builds, verifies, and publishes docs for ONE environment, as a run entirely independent
# of any other environment's run. Triggered (via the API, not a workflow_call) by
# docs-publish.yml, once per environment that applies to a given push (dev, prod, or both) -
# so if dev's run fails, prod's run is completely unaffected, and vice versa.
on:
  workflow_dispatch:
    inputs:
      build-ref:
        description: 'The git ref to build from'
        type: string
        required: true
      publish-env:
        description: 'staging or prod - passed through to reusable-docs-build.yml, which uses it to resolve DOCS_PUBLISH_URL'
        type: string
        required: true
      dispatch-env:
        description: 'dev or prod - the environment label used for the docs-publish dispatch payload'
        type: string
        required: true

jobs:

  docs-build:
    name: Generate HTML
    uses: ./.github/workflows/reusable-docs-build.yml
    with:
      docs-dir: 'docs'
      package-script: 'verify:publish'
      build-ref: ${{ inputs.build-ref }}
      fetch-depth: 0
      publish-env: ${{ inputs.publish-env }}

  docs-verify:
    name: Verify HTML
    needs: docs-build
    uses: ./.github/workflows/reusable-docs-verify.yml
    with:
      failOnWarnings: true
      