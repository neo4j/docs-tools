#  copy this workflow into your repo
name: "Documentation Teardown"

permissions:
  contents: read
  pull-requests: write

on:
  pull_request_target:
    branches:
      - dev
    types:
      - closed

jobs:
  teardown-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Distrust eMudhra/emSign root CAs (CA compromise)
        # Node ships its own CA list (which includes the eMudhra/emSign roots), so
        # upgrading the OS package is not enough for npm and Antora. Build a system CA
        # bundle without those roots and point OpenSSL and Node (--use-openssl-ca) at
        # it for every later step in this job. SSL_CERT_DIR is pointed at an empty
        # directory so OpenSSL does not also load /etc/ssl/certs.
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install --only-upgrade -y -qq ca-certificates
          sudo update-ca-certificates --fresh
          mkdir -p "$RUNNER_TEMP/ca-empty"
          python3 - <<'PY'
          import os, re, subprocess
          certs = re.findall(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----\n',
                             open('/etc/ssl/certs/ca-certificates.crt').read(), re.S)
          keep, drop = [], 0
          for c in certs:
              subj = subprocess.run(['openssl', 'x509', '-noout', '-subject'], input=c,
                                    capture_output=True, text=True).stdout
              if re.search(r'emsign|emudhra', subj, re.I):
                  drop += 1
              else:
                  keep.append(c)
          assert keep and len(keep) > 100, 'CA bundle unexpectedly small'
          out = os.path.join(os.environ['RUNNER_TEMP'], 'ca-bundle-no-emudhra.crt')
          open(out, 'w').write(''.join(keep))
          print(f'kept {len(keep)} roots, removed {drop} eMudhra/emSign roots')
          PY
          {
            echo "SSL_CERT_FILE=$RUNNER_TEMP/ca-bundle-no-emudhra.crt"
            echo "SSL_CERT_DIR=$RUNNER_TEMP/ca-empty"
            echo "NODE_OPTIONS=--use-openssl-ca"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f #v6
        with:
          node-version: lts/*

      - id: get-deploy-url
        env:
          ORG: ${{ github.event.repository.owner.login }}
          REPO: ${{ github.event.repository.name }}
          DEPLOYID: ${{ github.event.pull_request.number }}
        run: |
          deployurl=$ORG-$REPO-$DEPLOYID.surge.sh
          echo "deploy-url=$deployurl" >> $GITHUB_OUTPUT

      - name: Teardown documentation
        shell: bash
        env:
          SURGE_TOKEN: "${{ secrets.DOCS_SURGE_TOKEN }}"
          DEPLOY_URL: ${{ steps.get-deploy-url.outputs.deploy-url }}
        run: |
          npm install -g surge
          surge teardown $DEPLOY_URL --token "$SURGE_TOKEN"

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 #v3
        with:
          number: ${{ github.event.pull_request.number }}
          header: docs-pr-changes
          message: |
            Thanks for the documentation updates.

            The preview documentation has now been torn down - reopening this PR will republish it.
          GITHUB_TOKEN: ${{ secrets.DOCS_PR_COMMENT_TOKEN }}
      
