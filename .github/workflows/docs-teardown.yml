#  copy this workflow into your repo
name: "Documentation Teardown"

permissions:
  contents: read
  pull-requests: write

on:
  pull_request_target:
    branches:
      - dev
    types:
      - closed

jobs:
  teardown-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Refresh CA certificates (eMudhra CA compromise)
        # Upgrades the Ubuntu ca-certificates package and rebuilds the system trust
        # store. This only takes effect once Ubuntu has published a package that drops
        # the eMudhra root. It does not change Node's bundled CA list (npm, Antora),
        # and it warns rather than fails so a lagging package cannot break builds.
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install --only-upgrade -y -qq ca-certificates
          sudo update-ca-certificates --fresh
          if ls /etc/ssl/certs | grep -qiE 'emudhra|emsign'; then
            echo "::warning::eMudhra/emSign root is still in the system trust store; the Ubuntu ca-certificates package does not yet remove it."
          else
            echo "eMudhra/emSign roots not present in the system trust store."
          fi

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f #v6
        with:
          node-version: lts/*

      - id: get-deploy-url
        env:
          ORG: ${{ github.event.repository.owner.login }}
          REPO: ${{ github.event.repository.name }}
          DEPLOYID: ${{ github.event.pull_request.number }}
        run: |
          deployurl=$ORG-$REPO-$DEPLOYID.surge.sh
          echo "deploy-url=$deployurl" >> $GITHUB_OUTPUT

      - name: Teardown documentation
        shell: bash
        env:
          SURGE_TOKEN: "${{ secrets.DOCS_SURGE_TOKEN }}"
          DEPLOY_URL: ${{ steps.get-deploy-url.outputs.deploy-url }}
        run: |
          npm install -g surge
          surge teardown $DEPLOY_URL --token "$SURGE_TOKEN"

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 #v3
        with:
          number: ${{ github.event.pull_request.number }}
          header: docs-pr-changes
          message: |
            Thanks for the documentation updates.

            The preview documentation has now been torn down - reopening this PR will republish it.
          GITHUB_TOKEN: ${{ secrets.DOCS_PR_COMMENT_TOKEN }}
      
