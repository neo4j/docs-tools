name: "Trigger docs builds"

# Dispatches docs-generate-html.yml and docs-generate-pdf.yml for whatever just happened. The
# logic (which environments a branch belongs to, and the dispatching) is in the reusable
# workflow, so this file only keeps what has to be local to the repository.
#
# Use this when a single trigger might legitimately need to build more than one environment,
# for example a manual "rebuild everything" run, or a repo where the dev and prod branch in
# the branch record are the same. If your repo has clean, separate dev/prod branches, you
# may not need it: give docs-generate-html.yml its own `on: push: branches: [...]` trigger
# per environment instead (see docs-aura for that pattern).

permissions:
  contents: read
  actions: write

# Edit the branches list to match your repository: every branch listed in BOTH your dev and
# prod publish.yml playbooks (content sources' `branches`), so that a push to any of them runs
# this at all. A branch that belongs to neither environment builds nothing. It can't be read
# from the branch record, because a trigger can't take an expression: keep it in sync by hand.
on:
  push:
    branches:
    - 'dev'
  workflow_dispatch:

jobs:
  trigger:
    name: Trigger builds
    uses: ./.github/workflows/reusable-docs-trigger-builds.yml
    with:
      # The same docs-dir and playbook that docs-generate-html.yml builds with.
      playbook: docs/publish.yml
    secrets:
      DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
