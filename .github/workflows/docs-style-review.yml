name: "Docs style review (advisory)"

# Self-test / dogfood caller for the reusable style-review workflow, within docs-tools.
# Uses a RELATIVE path (only possible in the same repo) so it always tracks the reusable
# workflow on this branch — no tag/SHA needed while testing. Consumer repos instead use:
#   uses: neo4j/docs-tools/.github/workflows/reusable-docs-style-review.yml@v2

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
    paths:
      - '**/modules/**/pages/**/*.adoc'
      - '**/modules/**/partials/**/*.adoc'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  style-review:
    uses: ./.github/workflows/reusable-docs-style-review.yml
    secrets: inherit
