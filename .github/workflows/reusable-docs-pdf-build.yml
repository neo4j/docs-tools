name: Generate PDF

permissions:
  contents: read
  pull-requests: none

on:
  workflow_call:
    inputs:
      build-ref:
        description: 'The git ref (branch or tag) to checkout'
        required: false
        type: string
        default: ''
      fetch-depth:
        description: 'The git fetch depth: 1 to fetch just the ref (branch or tag), 0 for full history'
        required: false
        type: number
        default: 1
      docs-dir:
        description: 'The working directory to run jobs in'
        required: false
        type: string
        default: '.'
      node-version:
        description: 'The Node.js version to use'
        required: false
        type: string
        default: '24'
      antora-version:
        description: 'The Antora version to install (must be >=3.2.0 - @antora/pdf-extension needs the assembler it bundles from that version on)'
        required: false
        type: string
        default: '3.2.0'
      pdf-playbook:
        description: 'Antora playbook file, relative to docs-dir, that registers @neo4j-antora/pdf-generator - a small repo-specific file alongside preview.yml/publish.yml (content sources/attributes differ per docset, so not shared).'
        required: false
        type: string
        default: 'pdf.yml'
      retain-artifacts:
        description: 'The number of days to retain artifacts'
        type: number
        default: 28

jobs:

  build-pdf:
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: ${{ inputs.node-version }}
      ANTORA_VERSION: ${{ inputs.antora-version }}
      BUILD_REF: ${{ inputs.build-ref || '' }}
      FETCH_DEPTH: ${{ inputs.fetch-depth }}
      DOCS_DIR: ${{ inputs.docs-dir }}
      PDF_PLAYBOOK: ${{ inputs.pdf-playbook }}

    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ env.BUILD_REF }}
        fetch-depth: ${{ env.FETCH_DEPTH }}

    - name: Use Node.js version ${{ env.NODE_VERSION }}
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
      with:
        node-version: ${{ env.NODE_VERSION }}

    # @neo4j-antora/pdf-generator is a normal npm dependency the docset's own
    # package.json declares (see its own README) - it brings in
    # @antora/pdf-extension, the PDF theme/renderer/postprocessors, and its
    # own isolated Asciidoctor.js install (via its own postinstall) all by
    # itself. Nothing to check out or path-patch here any more.
    - name: Install docset dependencies
      working-directory: ${{ env.DOCS_DIR }}
      run: |
        npm install --omit=dev
        # Ensure a correct version of Antora, the same way reusable-docs-build.yml
        # does for the HTML build - @antora/pdf-extension needs the assembler
        # Antora 3.2.0+ bundles, regardless of what a docset's own package.json
        # currently pins.
        npm uninstall @antora/cli @antora/site-generator-default || true
        npm install "antora@${ANTORA_VERSION}"

    - name: Run Antora PDF build
      id: run-pdf-build
      working-directory: ${{ env.DOCS_DIR }}
      continue-on-error: true
      env:
        # Same fix as reusable-docs-build.yml's "Run package script" step:
        # antora requires local-path extensions (e.g. a sibling extensions/
        # dir) directly by their real filesystem path, bypassing node_modules
        # resolution entirely. NODE_PATH gives Node an extra place to look,
        # so those extensions can still find hoisted deps (e.g. vinyl) that
        # are only installed under docs-dir's node_modules.
        NODE_PATH: ${{ github.workspace }}/${{ env.DOCS_DIR }}/node_modules
      run: npx antora "$PDF_PLAYBOOK" --stacktrace --log-format=pretty

    - name: Get the dir that contains the PDF
      if: steps.run-pdf-build.outcome == 'success'
      working-directory: ${{ env.DOCS_DIR }}
      id: get-pdf-path
      run: |
        pdf_path=$(find build/site -iname '*.pdf' | head -1)
        if [ -z "$pdf_path" ]; then
          echo "::error::No PDF found under build/site - check the Antora log above"
          exit 1
        fi
        echo "pdf-path=$pdf_path" >> "$GITHUB_OUTPUT"

    - name: Upload PDF artifact
      if: steps.run-pdf-build.outcome == 'success'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: pdf
        path: ${{ env.DOCS_DIR }}/${{ steps.get-pdf-path.outputs.pdf-path }}
        retention-days: ${{ inputs.retain-artifacts }}

    - name: Fail job if PDF build failed
      if: always() && steps.run-pdf-build.outcome == 'failure'
      run: exit 1
